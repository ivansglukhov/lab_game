- type: entity
  id: NiiDirectorTerminal
  parent: BaseStructureComputer
  name: терминал директора НИИ
  description: Главный интерфейс управления институтом.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: rdcomp
      shader: unshaded
    - state: generic_keys
  - type: Appearance
  - type: NiiDirectorTerminal
  - type: ActivatableUI
    key: enum.NiiDirectorTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NiiDirectorTerminalUiKey.Key:
        type: NiiDirectorTerminalBoundUserInterface

- type: entity
  id: NiiInteriorDoor
  parent: MetalDoor
  name: внутренняя дверь НИИ
  description: Автоматическая герметичная дверь, не зависящая от внешней электросети прототипа.
  components:
  - type: Door
    bumpOpen: true
    clickOpen: true
  - type: NiiInteriorDoor
    activationRange: 2.5

- type: entity
  id: NiiResearchMachine
  parent: BaseMachine
  name: исследовательская установка
  description: Экспериментальная установка для проведения работ с подготовленными химическими образцами.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/artifact_analyzer.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: icon
    - state: display
      shader: unshaded
  - type: Transform
    anchored: true
  - type: NiiResearchMachine

- type: entity
  id: NiiCopperSulfateResearchSample
  parent: Beaker
  name: исследовательский образец медного купороса
  description: Произведённая и промаркированная партия медного купороса.
  components:
  - type: NiiResearchSample
  - type: Label
    currentLabel: медный купорос — исследовательская партия
  - type: Solution
    solution:
      reagents:
      - ReagentId: CopperSulfate
        Quantity: 15

- type: entity
  id: NiiChemicalReactor
  parent: BaseMachine
  name: реактор химического синтеза
  description: Установка последовательного синтеза промежуточных и исследовательских реагентов.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/mixer.rsi
    layers:
    - state: mixer_empty
    - state: mixer_screens
      shader: unshaded
  - type: Transform
    anchored: true
  - type: NiiChemicalReactor
  - type: Solution
    id: reactor
    solution:
      maxVol: 100

- type: entity
  id: NiiCopperStock
  parent: BaseItem
  name: ёмкость с медью
  description: Конечный складской запас очищенной меди для химического производства.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/beaker_large.rsi
    state: beakerlarge
  - type: NiiChemicalStock
    reagent: Copper
  - type: Label
    currentLabel: медь — 30 ед.
  - type: Solution
    id: beaker
    solution:
      maxVol: 100
      reagents:
      - ReagentId: Copper
        Quantity: 30

- type: entity
  id: NiiOxygenCanister
  parent: OxygenCanister
  name: складская канистра с кислородом
  description: Канистра с конечным запасом газообразного кислорода для производственных процессов НИИ.
  components:
  - type: NiiGasStock
    gas: Oxygen
    payloadEntity: NiiOxygenTransferTank
  - type: GasCanister
    air:
      volume: 1500
      moles:
        Oxygen: 30
      temperature: 293.15

- type: entity
  id: NiiOxygenTransferTank
  parent: OxygenTank
  categories: [ HideSpawnMenu ]
  name: переносной баллон с технологическим кислородом
  description: Баллон, наполненный из складской канистры для доставки кислорода к реактору.
  components:
  - type: GasTank
    air:
      volume: 20
      temperature: 293.15

- type: entity
  id: NiiSulfuricAcidStock
  parent: BaseItem
  name: ёмкость с серной кислотой
  description: Кислотостойкая складская ёмкость с конечным запасом серной кислоты.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/beaker_large.rsi
    state: beakerlarge
  - type: NiiChemicalStock
    reagent: SulfuricAcid
  - type: Label
    currentLabel: серная кислота — 60 ед.
  - type: Solution
    id: beaker
    solution:
      maxVol: 100
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 60

- type: entity
  id: NiiChemicalProductionOrder
  categories: [ HideSpawnMenu ]
  name: производственное поручение
  components:
  - type: NiiProductionOrder

- type: entity
  id: NiiStablePlasmaCultureResult
  parent: Beaker
  name: стабильная плазменная культура
  description: Первый воспроизводимый результат НИИ «Горизонт».
  components:
  - type: Label
    currentLabel: стабильная плазменная культура
  - type: NiiResearchResult
  - type: Solution
    solution:
      reagents:
      - ReagentId: CopperSulfate
        Quantity: 5
